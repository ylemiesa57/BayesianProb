name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pomegranate (BayesianLibraries.py's only dependency beyond the
          # rest of this list) pulls in a heavy torch/CUDA toolchain that
          # isn't needed to run the actual test suite below (it only
          # exercises BN.py/CyberBN.py/ComplexCyber.py/Monte_hall.py via
          # the from-scratch BayesianNetwork class), so it's intentionally
          # left out here to keep CI fast and reliable.
          pip install numpy scipy pandas plotly pytest
      - name: Byte-compile all modules
        run: python -m py_compile BN.py BayesianLibraries.py ComplexCyber.py CyberBN.py Monte_hall.py
      - name: Run test suite
        run: python -m pytest tests/ -v
